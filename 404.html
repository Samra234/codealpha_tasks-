
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found | Modern Calculator</title>
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #e8edf3;
            color: #f8fafc;
        }

        .error-container {
            width: 100%;
            max-width: 450px;
            padding: 40px 25px;
            text-align: center;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .error-code {
            margin-bottom: 15px;
            color: #f59e0b;
            font-size: clamp(70px, 15vw, 110px);
            font-weight: 800;
            line-height: 1;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 27px;
        }

        p {
            margin-bottom: 25px;
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.7;
        }

        .home-button {
            display: inline-block;
            padding: 14px 25px;
            border-radius: 10px;
            background: #f59e0b;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.2s ease,
                        transform 0.2s ease;
        }

        .home-button:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .home-button:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 4px;
        }

        @media (max-width: 400px) {
            .error-container {
                padding: 30px 18px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <main class="error-container">
        <div class="error-code">404</div>

        <h1>Oops! Page Not Found</h1>

        <p>
            The page you are looking for doesn't exist
            or may have been moved. Let's get you back
            to the calculator.
        </p>

        <a class="home-button" href="/">Back to Calculator</a>
    </main>
</body>
</html>
