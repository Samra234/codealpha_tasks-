    <!-- Corrected Lightbox Element Container -->
    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="closeBtn" aria-label="Close gallery">&times;</button>
        <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous image">❮</button>

        <div class="lightbox-content">
            <div class="counter" id="counter">1/18</div>
            <img id="lightboxImage" src="" alt="Active Modal View">
            <p id="caption"></p>
        </div>
